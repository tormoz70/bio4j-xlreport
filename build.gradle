plugins {
    id 'com.vanniktech.maven.publish' version '0.37.0' apply false
}

import com.vanniktech.maven.publish.JavaLibrary
import com.vanniktech.maven.publish.JavadocJar

allprojects {
    group = 'ru.myway-line.xlreport'
    version = '0.1.1'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok:1.18.38'
        annotationProcessor 'org.projectlombok:lombok:1.18.38'

        testCompileOnly 'org.projectlombok:lombok:1.18.38'
        testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'

        testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
        testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.17'
        runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

def publishedModules = [
        project(':engine-core'),
        project(':engine-poi'),
        project(':engine-js'),
]

def canSignPublications = (
        findProperty('signing.keyId') ||
        findProperty('signingInMemoryKey') ||
        System.getenv('ORG_GRADLE_PROJECT_signingInMemoryKey')
)

configure(publishedModules) {
    apply plugin: 'com.vanniktech.maven.publish'

    // Empty javadoc jar: Lombok builders are not visible to plain javadoc.
    mavenPublishing {
        configure(new JavaLibrary(new JavadocJar.Empty(), true))
        publishToMavenCentral()
        if (canSignPublications) {
            signAllPublications()
        }

        coordinates(project.group.toString(), project.name, project.version.toString())

        pom {
            name = "bio4j-xlreport ${project.name}"
            description = project.findProperty('POM_DESCRIPTION') ?:
                    'Java 21 Excel report engine: XML definitions, XLSX templates, Apache POI, GraalJS'
            inceptionYear = '2026'
            url = 'https://github.com/tormoz70/bio4j-xlreport'
            licenses {
                license {
                    name = 'The Apache License, Version 2.0'
                    url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    distribution = 'repo'
                }
            }
            developers {
                developer {
                    id = 'tormoz70'
                    name = 'Ayrat'
                    url = 'https://github.com/tormoz70'
                }
            }
            scm {
                url = 'https://github.com/tormoz70/bio4j-xlreport'
                connection = 'scm:git:git://github.com/tormoz70/bio4j-xlreport.git'
                developerConnection = 'scm:git:ssh://git@github.com/tormoz70/bio4j-xlreport.git'
            }
        }
    }
}
